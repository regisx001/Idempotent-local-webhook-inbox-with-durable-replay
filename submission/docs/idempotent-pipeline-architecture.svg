<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1120 780" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="solution-flow-title solution-flow-desc">
        <title id="solution-flow-title">Two-Tier Webhook Inbox Architecture &amp; Persistence Pipeline</title>
        <desc id="solution-flow-desc">Flowchart and system architecture showing request validation, delivery identity deduplication, immediate key reservation, monotonic version checking, and atomic state saving.</desc>
        <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
          <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
            <circle cx="2" cy="2" r="1" fill="rgba(10,37,64,0.08)"/>
          </pattern>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#425466"/>
          </marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#635bff"/>
          </marker>
        </defs>

        <!-- Canvas Background -->
        <rect width="100%" height="100%" fill="#f6f9fc"/>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.7"/>

        <!-- ================= TIER BOUNDARY ZONES ================= -->
        <!-- Tier 1 Zone -->
        <rect x="40" y="96" width="1040" height="216" rx="8" fill="rgba(10,37,64,0.02)" stroke="rgba(10,37,64,0.10)" stroke-width="0.8"/>
        <rect x="56" y="104" width="220" height="12" rx="2" fill="#f6f9fc"/>
        <text x="166" y="113" fill="#687d94" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">TIER 1 · DELIVERY IDENTITY GATE</text>

        <!-- Tier 2 Zone -->
        <rect x="40" y="328" width="1040" height="232" rx="8" fill="rgba(10,37,64,0.02)" stroke="rgba(10,37,64,0.10)" stroke-width="0.8"/>
        <rect x="56" y="336" width="220" height="12" rx="2" fill="#f6f9fc"/>
        <text x="166" y="345" fill="#687d94" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">TIER 2 · ENTITY MONOTONICITY GATE</text>

        <!-- Durability Zone -->
        <rect x="40" y="576" width="1040" height="128" rx="8" fill="rgba(99,91,255,0.02)" stroke="rgba(99,91,255,0.2)" stroke-width="0.8" stroke-dasharray="4,4"/>
        <rect x="56" y="584" width="248" height="12" rx="2" fill="#f6f9fc"/>
        <text x="180" y="593" fill="#635bff" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">ADR-04 · SAME-DIRECTORY ATOMIC DURABILITY</text>

        <!-- ================= CONNECTORS (Drawn first behind nodes) ================= -->

        <!-- 1. Ingress -> Gate 1 Check (Straight vertical line) -->
        <line x1="560" y1="64" x2="560" y2="136" stroke="#425466" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- 2. Gate 1 [INVALID] -> Discard Node (Horizontal left) -->
        <line x1="460" y1="180" x2="280" y2="180" stroke="#425466" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- 3. Gate 1 [VALID] -> Identity Gate Check (Straight vertical) -->
        <line x1="560" y1="224" x2="560" y2="248" stroke="#425466" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- 4. Identity Gate [EXISTS] -> Deduplication Evaluator (Horizontal right) -->
        <line x1="660" y1="292" x2="820" y2="292" stroke="#425466" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- 5. Identity Gate [NEW ID] -> Key Reservation Point (Straight vertical) -->
        <line x1="560" y1="336" x2="560" y2="368" stroke="#425466" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- 6. Key Reservation -> Monotonicity Check (Straight vertical) -->
        <line x1="560" y1="424" x2="560" y2="456" stroke="#425466" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- 7. Monotonic Check [HIGHER/NEW] -> Applied Advance State (Focal Accent connector) -->
        <line x1="560" y1="544" x2="560" y2="600" stroke="#635bff" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

        <!-- 8. Monotonic Check [LEQ] -> Terminal Non-Applied (Horizontal right) -->
        <line x1="668" y1="500" x2="820" y2="500" stroke="#425466" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- 9. Batch Complete -> Atomic File Swap (Right elbow from Applied to Atomic Save) -->
        <path d="M 680,632 H 784 Q 792,632 792,640 V 648" fill="none" stroke="#635bff" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow-accent)"/>

        <!-- ================= CONNECTOR LABELS (With mask rects & 8px gap) ================= -->

        <!-- Label 2: Check 1 INVALID -->
        <rect x="336" y="160" width="68" height="12" rx="2" fill="#f6f9fc"/>
        <text x="370" y="169" fill="#425466" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SCHEMA/TENANT</text>

        <!-- Label 3: Check 1 VALID -->
        <rect x="568" y="230" width="44" height="12" rx="2" fill="#f6f9fc"/>
        <text x="590" y="239" fill="#425466" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">VALID</text>

        <!-- Label 4: Identity Gate EXISTS -->
        <rect x="704" y="272" width="64" height="12" rx="2" fill="#f6f9fc"/>
        <text x="736" y="281" fill="#425466" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SEEN ID</text>

        <!-- Label 5: Identity Gate NEW ID -->
        <rect x="568" y="344" width="56" height="12" rx="2" fill="#f6f9fc"/>
        <text x="596" y="353" fill="#425466" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NEW KEY</text>

        <!-- Label 7: Monotonic NEWER/NEW -->
        <rect x="568" y="564" width="68" height="12" rx="2" fill="#f6f9fc"/>
        <text x="602" y="573" fill="#635bff" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NEWER / NEW</text>

        <!-- Label 8: Monotonic LEQ -->
        <rect x="700" y="480" width="80" height="12" rx="2" fill="#f6f9fc"/>
        <text x="740" y="489" fill="#425466" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">v ≤ CURRENT</text>

        <!-- ================= NODES ================= -->

        <!-- Ingress Node (Top Oval) -->
        <rect x="440" y="20" width="240" height="44" rx="22" fill="#ffffff" stroke="#0a2540" stroke-width="1"/>
        <text x="560" y="42" fill="#0a2540" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">CLI Delivery Ingress</text>
        <text x="560" y="54" fill="#687d94" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">input.deliveries batch</text>

        <!-- Check 1: Schema & Tenant Decision Diamond -->
        <polygon points="560,136 660,180 560,224 460,180" fill="#ffffff" stroke="#0a2540" stroke-width="1"/>
        <text x="560" y="176" fill="#0a2540" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Valid fields</text>
        <text x="560" y="190" fill="#0a2540" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">&amp; tenant match?</text>

        <!-- Discard Node (Left Box) -->
        <rect x="80" y="152" width="200" height="56" rx="6" fill="#ffffff" stroke="rgba(10,37,64,0.30)" stroke-width="1"/>
        <rect x="88" y="160" width="60" height="12" rx="2" fill="transparent" stroke="rgba(223,27,65,0.4)" stroke-width="0.8"/>
        <text x="118" y="169" fill="#df1b41" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REJECTED</text>
        <text x="180" y="182" fill="#0a2540" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Discard Delivery</text>
        <text x="180" y="196" fill="#687d94" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">never reserves key</text>

        <!-- Identity Gate: Seen delivery_id? -->
        <polygon points="560,248 660,292 560,336 460,292" fill="#ffffff" stroke="#0a2540" stroke-width="1"/>
        <text x="560" y="288" fill="#0a2540" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">delivery_id</text>
        <text x="560" y="302" fill="#0a2540" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">in state.deliveries?</text>

        <!-- Deduplication Result Box (Right) -->
        <rect x="820" y="260" width="224" height="64" rx="6" fill="#ffffff" stroke="#0a2540" stroke-width="1"/>
        <rect x="828" y="268" width="84" height="12" rx="2" fill="transparent" stroke="rgba(66,84,102,0.4)" stroke-width="0.8"/>
        <text x="870" y="277" fill="#425466" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">IDEMPOTENCY</text>
        <text x="932" y="294" fill="#0a2540" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Same → duplicate</text>
        <text x="932" y="308" fill="#df1b41" font-size="10" font-weight="500" font-family="'Geist', sans-serif" text-anchor="middle">Diff → delivery conflict</text>
        <text x="932" y="318" fill="#687d94" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">findings untouched; stop</text>

        <!-- Key Reservation Point -->
        <rect x="440" y="368" width="240" height="56" rx="6" fill="#ffffff" stroke="#0a2540" stroke-width="1"/>
        <rect x="448" y="376" width="76" height="12" rx="2" fill="transparent" stroke="rgba(10,37,64,0.4)" stroke-width="0.8"/>
        <text x="486" y="385" fill="#425466" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RESERVE KEY</text>
        <text x="560" y="400" fill="#0a2540" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Store delivery_id Now</text>
        <text x="560" y="414" fill="#425466" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">state.deliveries[id] = canonical</text>

        <!-- Monotonicity Decision Diamond -->
        <polygon points="560,456 668,500 560,544 452,500" fill="#ffffff" stroke="#0a2540" stroke-width="1"/>
        <text x="560" y="496" fill="#0a2540" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Finding Absent or</text>
        <text x="560" y="510" fill="#0a2540" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">version &gt; current?</text>

        <!-- Applied Focal Node (Coral Accent) -->
        <rect x="440" y="600" width="240" height="64" rx="6" fill="rgba(99,91,255,0.08)" stroke="#635bff" stroke-width="1.2"/>
        <rect x="448" y="608" width="60" height="12" rx="2" fill="transparent" stroke="rgba(99,91,255,0.5)" stroke-width="0.8"/>
        <text x="478" y="617" fill="#635bff" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">APPLIED</text>
        <text x="560" y="632" fill="#0a2540" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Advance Finding State</text>
        <text x="560" y="648" fill="#635bff" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">findings[id] = {version, status}</text>

        <!-- Terminal Non-Advancing Outcomes (Right) -->
        <rect x="820" y="468" width="224" height="68" rx="6" fill="#ffffff" stroke="rgba(10,37,64,0.4)" stroke-width="1"/>
        <text x="932" y="488" fill="#0a2540" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Version ≤ Current State</text>
        <text x="932" y="502" fill="#425466" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">v &lt; curr → stale (ignore)</text>
        <text x="932" y="516" fill="#0073e6" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">v == curr &amp; same → redundant</text>
        <text x="932" y="528" fill="#df1b41" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">v == curr &amp; diff → version conflict</text>

        <!-- Atomic Durability Node (ADR-04) -->
        <rect x="760" y="648" width="284" height="48" rx="6" fill="#ffffff" stroke="#635bff" stroke-width="1"/>
        <rect x="768" y="654" width="56" height="12" rx="2" fill="transparent" stroke="rgba(99,91,255,0.4)" stroke-width="0.8"/>
        <text x="796" y="663" fill="#635bff" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ATOMIC</text>
        <text x="902" y="670" fill="#0a2540" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Sibling .tmp Swap (os.replace)</text>
        <text x="902" y="684" fill="#687d94" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">zero-byte safe; corrupt state preserved</text>

        <!-- ================= LEGEND STRIP ================= -->
        <line x1="40" y1="724" x2="1080" y2="724" stroke="rgba(10,37,64,0.12)" stroke-width="0.8"/>
        <text x="40" y="748" fill="#425466" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND · PIPELINE PRIMITIVES</text>

        <!-- Legend 1 -->
        <polygon points="240,746 250,740 260,746 250,752" fill="#ffffff" stroke="#0a2540" stroke-width="1"/>
        <text x="268" y="750" fill="#425466" font-size="8.5" font-family="'Geist', sans-serif">Decision Diamond</text>

        <!-- Legend 2 -->
        <rect x="380" y="740" width="24" height="12" rx="2" fill="#ffffff" stroke="#0a2540" stroke-width="1"/>
        <text x="412" y="750" fill="#425466" font-size="8.5" font-family="'Geist', sans-serif">Action / Store Node</text>

        <!-- Legend 3 -->
        <rect x="540" y="740" width="24" height="12" rx="2" fill="rgba(99,91,255,0.08)" stroke="#635bff" stroke-width="1"/>
        <text x="572" y="750" fill="#425466" font-size="8.5" font-family="'Geist', sans-serif">Applied State Mutation</text>

        <!-- Legend 4 -->
        <line x1="720" y1="746" x2="748" y2="746" stroke="#635bff" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="756" y="750" fill="#425466" font-size="8.5" font-family="'Geist', sans-serif">State Progression</text>

        <!-- Legend 5 -->
        <rect x="880" y="740" width="24" height="12" rx="4" fill="rgba(10,37,64,0.02)" stroke="rgba(10,37,64,0.15)" stroke-width="0.8"/>
        <text x="912" y="750" fill="#425466" font-size="8.5" font-family="'Geist', sans-serif">Boundary Zone</text>
      </svg>
